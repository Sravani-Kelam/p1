# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/revjobs_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=ROOT
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=revjobs2024secretkeyforsecuritypurposesandtokengeneration
jwt.expiration=86400000

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.revjobs=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://localhost:3001

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
