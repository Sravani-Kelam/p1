server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: revjobs-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/revjobs_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ROOT
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: revjobs2024secretkeyforsecuritypurposesandtokengeneration
  expiration: 86400000

logging:
  level:
    org.springframework.web: INFO
    com.revjobs: DEBUG
    org.hibernate.SQL: DEBUG

cors:
  allowed:
    origins: http://localhost:3000,http://localhost:3001
